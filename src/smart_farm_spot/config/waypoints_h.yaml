# H자 주행코스 웨이포인트 (map 좌표계, 단위 m / yaw 도)
#
#   (0,3) ●        ● (2,3)      위쪽 끝
#         │        │
#   (0,1.5)●──────●(2,1.5)      가로 바
#         │        │
#   (0,0) ●        ● (2,0)      아래쪽 끝
#
# 한 붓 그리기 순서: 왼쪽 세로 ↑ → 중간 복귀 → 가로 바 → 오른쪽 세로 ↑↓
# 사용:
#   ros2 run smart_farm_spot waypoint_patrol \
#       --ros-args -p waypoints_file:=<이 파일 경로>

waypoints:
  # ① (0,0) 제자리 시작점 제거 — 목표 xy=현재 xy 면 경로길이 0 으로
  #    DWB 가 멈추는 quirk. 로봇이 이미 (0,0)이라 바로 전진(0,3)부터.
  - {x: 0.0, y: 3.0, yaw: 90.0}     # ② 좌측 세로 끝(상)
  - {x: 0.0, y: 1.5, yaw: 0.0}      # ③ 좌측 중간 복귀, 오른쪽 바라봄
  - {x: 2.0, y: 1.5, yaw: 0.0}      # ④ 가로 바 → 우측 중간
  - {x: 2.0, y: 3.0, yaw: 90.0}     # ⑤ 우측 세로 끝(상)
  - {x: 2.0, y: 0.0, yaw: -90.0}    # ⑥ 우측 세로 끝(하)
