# 투명(센서 미감지) 가상벽 Keepout 필터 서버 설정.
#   filter_mask_server   : keepout 마스크(maps/keepout_mask.yaml) 를 /keepout_filter_mask 로 발행
#   costmap_filter_info_server : KeepoutFilter 가 읽는 필터정보(/costmap_filter_info) 발행
# 마스크는 tools/make_keepout_mask.py 로 barn 충돌맵(투명벽 포함)에서 생성.
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 0                                # 0 = keepout filter
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: "keepout_mask.yaml"     # maps/ 아래(런치에서 절대경로 주입)
