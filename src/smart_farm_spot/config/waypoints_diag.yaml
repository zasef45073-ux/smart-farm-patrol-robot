# 끝 → 대각선 끝 주행 (map 좌표계, m / yaw 도)
# 로봇 시작 ≈ (0,0). H 코스의 좌하단 끝에서 우상단 끝으로 대각선 횡단.
# 중앙 (1.0,1.5) 에 배변 우리 저마찰 패치 → 횡단 중 미끄러짐 시연.
#
#   (0,3)            ● (2,3)  ← 목표(우상단 끝)
#                  ╱
#              [우리]          중앙 저마찰
#            ╱
#   (0,0) ●                   ← 시작(좌하단 끝)
#
# 첫 점이 현재 위치(0,0)면 DWB 경로길이0 으로 멈추므로 시작점은 넣지 않음.

waypoints:
