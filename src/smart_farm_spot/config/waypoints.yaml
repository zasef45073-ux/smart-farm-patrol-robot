# 뒤쪽 통로 순찰 웨이포인트 (map 좌표계, 단위 m / yaw 단위 도)
#
# 사용:
#   ros2 run spot_nav2 waypoint_patrol \
#       --ros-args -p waypoints_file:=<이 파일 경로>
#
# 실제 축사 맵에 맞춰 좌표를 조정하세요.

waypoints:
  - {x: 1.0, y: 0.0, yaw: 0.0}      # 통로 진입
  - {x: 3.0, y: 0.0, yaw: 0.0}      # 소 1 후면 관찰
  - {x: 5.0, y: 0.0, yaw: 0.0}      # 소 2 후면 관찰
  - {x: 7.0, y: 0.0, yaw: 0.0}      # 소 3 후면 관찰
  - {x: 8.0, y: 0.0, yaw: 90.0}     # 통로 끝 회전
  - {x: 8.0, y: 2.0, yaw: 180.0}    # 복귀 경로
  - {x: 1.0, y: 2.0, yaw: 180.0}    # 시작점 근처
  - {x: 0.0, y: 0.0, yaw: -90.0}    # 대기 위치 복귀
